name: Aggiorna calendario orari

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui scraping e genera ICS
        env:
          ORARIO_URL: ${{ vars.ORARIO_URL }}
        run: python update_calendar.py "$ORARIO_URL"

      - name: Commit ICS se cambiato o nuovo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add orari_lezioni.ics
          # git diff --cached vede sia le modifiche a file tracciati
          # sia i file appena aggiunti (a differenza di "git diff" semplice,
          # che ignora i file mai committati prima).
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna orari_lezioni.ics [skip ci]"
            git push
          else
            echo "Nessuna modifica da committare."
          fi
