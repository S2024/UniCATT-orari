name: Aggiorna calendario orari

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update-ics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui scraping lezioni ed esami e genera ICS
        env:
          ORARIO_URL: ${{ vars.ORARIO_URL }}
          ESAMI_URL: ${{ vars.ESAMI_URL }}
        run: |
          test -n "$ORARIO_URL" || { echo "Variabile ORARIO_URL mancante"; exit 1; }
          test -n "$ESAMI_URL" || { echo "Variabile ESAMI_URL mancante"; exit 1; }
          python -u update_calendar.py "$ORARIO_URL" "$ESAMI_URL"

      - name: Commit ICS se cambiato o nuovo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- orari_lezioni.ics
          if ! git diff --cached --quiet -- orari_lezioni.ics; then
            git commit -m "Aggiorna lezioni ed esami [skip ci]" -- orari_lezioni.ics
            git push
          else
            echo "Nessuna modifica da committare."
          fi
